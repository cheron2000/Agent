[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-agent"
version = "0.2.0"
description = "Direct Windows Desktop Automation with Eyes (OCR/Vision) and Hands (Input)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "cheron2000"}
]
keywords = ["desktop", "automation", "agent", "windows", "ocr", "pyautogui"]
dependencies = [
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "pyperclip>=1.8.2",
    "pywin32>=306; platform_system=='Windows'",
    "psutil>=5.9.0",
    "pycaw>=20240210; platform_system=='Windows'",
    "comtypes>=1.4.0; platform_system=='Windows'",
    "screen-brightness-control>=0.22.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
py-modules = ["agent_server", "api_client", "ai_controller"]

[tool.pytest.ini_options]
testpaths = ["tests", "Hands/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
